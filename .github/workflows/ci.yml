name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # daily at 6am UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install ruff
        run: |
          python -m venv .venv
          # Quote the specifier: unquoted, the shell parses `ruff>=0.6.0` as
          # `ruff` plus a `>` redirect into a file literally named `=0.6.0`, so
          # the version floor never reaches pip and a stray artifact is written.
          .venv/bin/pip install 'ruff>=0.6.0'

      - name: Run ruff
        run: .venv/bin/ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install project
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[full]"

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/ --ignore=tests/integration --ignore=tests/compat -q

  integration:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install project
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[full]"

      - name: Run integration tests
        run: .venv/bin/python -m pytest tests/integration/ --run-integration -v --tb=long
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  packaging-smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip build
          .venv/bin/python -m build --wheel

      - name: Bare install + smoke (CH-GAP-041 gate)
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "from chimera import Engine; print('import OK')"
          /tmp/smoke-venv/bin/chimera --help >/dev/null
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' | /tmp/smoke-venv/bin/chimera-mcp 2>/dev/null | grep -m1 '"jsonrpc":"2.0"' | grep -q '"serverInfo"' && echo 'mcp handshake OK'

      - name: Server smoke — stream:true 400 (CH-GAP-040 gate)
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          /tmp/smoke-venv/bin/pip install "${WHEEL}[server]"
          mkdir -p /tmp/gate-cfg
          cat > /tmp/gate-cfg/chimera.yaml <<'YAML'
          server:
            port: 8899
            host: 127.0.0.1
          defaults:
            dispatcher: "auto"
            default_worker: "auto"
            default_aggregator: "auto"
          YAML
          cd /tmp/gate-cfg
          CHIMERA_CONFIG=/tmp/gate-cfg/chimera.yaml /tmp/smoke-venv/bin/chimera serve --port 8899 &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/stream_resp.json -w '%{http_code}' -X POST localhost:8899/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"auto","messages":[{"role":"user","content":"hi"}],"stream":true}' || true)
            [ "$code" = "400" ] && break
            sleep 1
          done
          kill $SERVE_PID 2>/dev/null || true
          [ "$code" = "400" ] && grep -q 'stream_not_supported' /tmp/stream_resp.json && echo 'stream:true -> 400 OK' || (echo 'stream gate FAILED'; exit 1)

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m venv .venv
          .venv/bin/pip install build twine
          .venv/bin/python -m build

      - name: Publish to PyPI
        run: .venv/bin/twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  release-verify:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Derive the exact expected version from the triggering tag (DF-CHIMERA-0911-2)
        run: |
          # Strips the leading v, rejects unsafe/non-PEP-440 tags, and fails
          # unless the tag exactly matches pyproject.toml's declared version.
          VERSION=$(python scripts/release_expected_version.py "${GITHUB_REF_NAME}")
          echo "expected published version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Fresh-venv install of the EXACT published version (DF-CHIMERA-0911-2 gate)
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install --upgrade pip
          # Bounded retry for PyPI index propagation lag after twine upload.
          # The requirement is pinned ==${VERSION} on EVERY attempt, so the
          # loop can never silently fall through to a different/latest version.
          installed=0
          for attempt in $(seq 1 20); do
            if /tmp/release-venv/bin/pip install "chimera-deliberation[full]==${VERSION}"; then
              installed=1
              break
            fi
            echo "attempt ${attempt}/20: chimera-deliberation==${VERSION} not yet on PyPI; sleeping 15s"
            sleep 15
          done
          if [ "${installed}" != "1" ]; then
            echo "FATAL: chimera-deliberation[full]==${VERSION} never became installable after 20 attempts (~5 min)"
            exit 1
          fi
          # Belt-and-braces: the imported package must BE the tag version.
          /tmp/release-venv/bin/python -c "import chimera, sys; v = chimera.__version__; print('installed', v); sys.exit(0 if v == '${VERSION}' else 'installed %r != tag version ${VERSION}' % v)"

      - name: README quickstart CLI surface on the PUBLISHED wheel — --version / -m --version / --help / config init (DF-CHIMERA-0916B-3 gate)
        run: |
          # Asserts the CLI surface README's Quickstart block documents against
          # the PUBLISHED, pinned wheel — not against the repo tree. 0.2.5
          # shipped with `chimera --version` exiting 2 ("Error: No such option
          # '--version'.") because the tag was cut two days behind the --version
          # commit (d6f144c): repo HEAD had the flag, the artifact users
          # installed did not, and every earlier gate in this job stayed green.
          # Each check runs in its own empty temp cwd (never the repo root) and
          # exits 1 naming the failing check.
          python scripts/quickstart_battery.py --venv /tmp/release-venv --expected-version "${VERSION}"

      - name: Quickstart E2E — config init + bare run at the exact tag version (DF-CHIMERA-0906-1 gate)
        run: |
          cd /tmp
          /tmp/release-venv/bin/chimera config init
          test -f chimera.yaml && echo 'config init OK'
          timeout 180 /tmp/release-venv/bin/chimera run "Reply with exactly: GATE-OK" 2>&1 | tee /tmp/gate_run.out
          grep -q "GATE-OK" /tmp/gate_run.out && echo 'bare run merged answer OK'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: MCP stdio purity probe — real tools/call depth, both gate formations (DF-CHIMERA-0911-2 gate)
        run: |
          # scripts/probe_mcp_stdio.py drives initialize -> tools/list -> a REAL
          # chimera_deliberate tools/call and exits 1 on ANY non-JSON-RPC stdout
          # line. The leak this gates is formation-dependent (0.2.3's 'speed'
          # OpenRouter leg printed LiteLLM's banner to stdout while 'simple'
          # stayed clean), and the old initialize-only handshake grep passed
          # 0.2.3 — so both formations are probed at full depth.
          #
          # DF-CHIMERA-0917-5: the probe provisions its OWN config. The repo-root
          # chimera.yaml is untracked by design, so a fresh checkout has none and
          # the probe used to drive an empty config (every call answered
          # unknown_formation in ~1s with zero provider calls). It now generates
          # a config in a temp dir with the release venv's own `chimera config
          # init` and points the child at it via CHIMERA_CONFIG. It also remaps
          # models whose provider has no credential here (the 'speed' formation's
          # OpenRouter worker) onto DEEPSEEK_API_KEY, printing each substitution
          # as FORMATION_MODEL_REMAP=... — so OPENROUTER_API_KEY is NOT required
          # by this step (the repo has no such secret; only DEEPSEEK_API_KEY and
          # PYPI_TOKEN exist, and tests/test_release_workflow.py pins that).
          python scripts/probe_mcp_stdio.py --formation=simple /tmp/release-venv/bin/chimera-mcp
          python scripts/probe_mcp_stdio.py --formation=speed /tmp/release-venv/bin/chimera-mcp
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
