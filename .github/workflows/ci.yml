name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # daily at 6am UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install ruff
        run: |
          python -m venv .venv
          # Quote the specifier: unquoted, the shell parses `ruff>=0.6.0` as
          # `ruff` plus a `>` redirect into a file literally named `=0.6.0`, so
          # the version floor never reaches pip and a stray artifact is written.
          .venv/bin/pip install 'ruff>=0.6.0'

      - name: Run ruff
        run: .venv/bin/ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install project
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # `dev` is load-bearing here, not convenience: the unit lane runs
          # tests/test_lsp_lint_plugins.py, which drives pylsp's pycodestyle and
          # pyflakes backends. python-lsp-server[pycodestyle,pyflakes] is declared
          # in the dev extra alone, so `.[full]` alone failed every matrix version
          # with ModuleNotFoundError: No module named 'pylsp'
          # (INT-GATE-003, CI runs 35355829236 / 35355973875).
          .venv/bin/pip install -e ".[dev,full]"

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/ --ignore=tests/integration --ignore=tests/compat -q

      - name: README quickstart CLI surface on the editable tree — --version / -m --version / --help / config init (DF-CHIMERA-0917-4 gate)
        run: |
          # Same battery the release-verify gate runs against the PUBLISHED
          # wheel, but pointed at THIS checkout's editable install: the
          # release-verify step is tag-gated, so between release cuts a tree
          # whose CLI drifts from its own README (a documented flag renamed or
          # removed, a broken console script, `config init` regressing) stayed
          # invisible until a tag was cut — the window in which a release
          # shipped with the console script rejecting `--version` (exit 2)
          # while every earlier gate in this job stayed green.
          # Every check is local (click argv parsing plus a file copy) and runs
          # in its own fresh empty temp cwd, so this step is keyless and
          # network-free.
          #
          # The expected version is derived from pyproject.toml AT THIS COMMIT
          # — never hardcoded, never read back from the artifact under test
          # (that would compare the artifact against itself).
          VERSION=$(.venv/bin/python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "expected version from pyproject.toml: ${VERSION}"
          .venv/bin/python scripts/quickstart_battery.py --venv .venv --expected-version "${VERSION}"

  integration:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # INT-CI-022 — this is the only job in the workflow that SPENDS a real
    # provider credential (`secrets.DEEPSEEK_API_KEY`), and that account is
    # unfunded. DeepSeek rejects every deliberation call with its billing
    # error, so on 2026-11-20 the leg failed 31x for a BILLING STATE, not for
    # code (run 44704272700: every other job green, `integration` the sole
    # failure):
    #   litellm.BadRequestError: OpenAIException - Insufficient Balance
    #     (request_id: 399f8709-7f03-401e-8e7e-0ff5606b1c2e)
    # Topping the account up is an owner decision, so the leg is deliberately
    # NON-BLOCKING (arm (b) of INT-CI-022) while still EXECUTING the whole
    # tests/integration/ suite: coverage, the full log, and per-test results
    # all stay — a provider billing state simply no longer turns `main`
    # permanently red. Delete `continue-on-error` once the account is funded;
    # the report step below says so explicitly whenever the leg passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install project
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[full]"

      - name: Run integration tests
        # `tee` leaves the pytest output on disk for the report step, which uses
        # it to tell a provider-billing failure apart from a real integration
        # regression. `pipefail` is load-bearing: without it the pipeline takes
        # tee's exit status (always 0) and this step would read as PASSING no
        # matter what the suite did.
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/integration/ --run-integration -v --tb=long 2>&1 | tee integration-leg.log
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Degraded-leg report — record the billing reason (INT-CI-022)
        # `always()` so the reason is on the run even when the suite above fails
        # (that is the expected state while the provider account is unfunded).
        if: always()
        run: |
          LOG=integration-leg.log
          REASON='integration leg non-blocking: provider account unfunded (402 Insufficient Balance) — tracked as INT-CI-022; funding is an owner decision'

          failed=0
          if [ -f "$LOG" ]; then
            # pytest's own summary line is the authoritative failure count.
            failed=$(sed -nE 's/.*(^|[^0-9])([0-9]+) failed.*/\2/p' "$LOG" | tail -1)
            failed=${failed:-0}
            billing=$(grep -c 'Insufficient Balance' "$LOG" 2>/dev/null || true)
            billing=${billing:-0}
          else
            billing=0
          fi

          # One string, one place: the annotation, the step summary and the
          # stdout all quote the same recorded reason.
          echo "::warning title=integration leg is non-blocking (INT-CI-022)::${REASON}"
          echo "$REASON"
          {
            echo "### Integration leg — non-blocking (INT-CI-022)"
            echo
            echo "$REASON"
            echo
            echo "- pytest failures this run: ${failed}"
            echo "- 'Insufficient Balance' occurrences: ${billing}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -eq 0 ]; then
            # The suite passed: the credential is funded (or the leg was
            # narrowed), so the non-blocking flag has served its purpose.
            echo "::warning title=integration leg passed — restore blocking::the suite passed at this run; delete 'continue-on-error: true' from the integration job to make the leg blocking again"
            exit 0
          fi

          if [ "$billing" -gt 0 ]; then
            echo "Classified: provider billing (${billing} billing rejections behind ${failed} failed test(s)) — matches the recorded INT-CI-022 state."
            exit 0
          fi

          # Failed WITHOUT the billing signature: that is a code regression, not
          # a billing state. The job is non-blocking by design, so surface it as
          # a loud error annotation instead of silently absorbing it.
          echo "::error title=integration regression, not billing::${failed} integration test(s) failed with no 'Insufficient Balance' in the log — this is a CODE regression, not the INT-CI-022 billing state"
          exit 0

  packaging-smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip build
          .venv/bin/python -m build --wheel

      - name: Bare install + smoke (CH-GAP-041 gate)
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/python -c "from chimera import Engine; print('import OK')"
          /tmp/smoke-venv/bin/chimera --help >/dev/null
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' | /tmp/smoke-venv/bin/chimera-mcp 2>/dev/null | grep -m1 '"jsonrpc":"2.0"' | grep -q '"serverInfo"' && echo 'mcp handshake OK'

      - name: Server smoke — stream:true 400 (CH-GAP-040 gate)
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          /tmp/smoke-venv/bin/pip install "${WHEEL}[server]"
          mkdir -p /tmp/gate-cfg
          cat > /tmp/gate-cfg/chimera.yaml <<'YAML'
          server:
            port: 8899
            host: 127.0.0.1
          defaults:
            dispatcher: "auto"
            default_worker: "auto"
            default_aggregator: "auto"
          YAML
          cd /tmp/gate-cfg
          CHIMERA_CONFIG=/tmp/gate-cfg/chimera.yaml /tmp/smoke-venv/bin/chimera serve --port 8899 &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/stream_resp.json -w '%{http_code}' -X POST localhost:8899/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"auto","messages":[{"role":"user","content":"hi"}],"stream":true}' || true)
            [ "$code" = "400" ] && break
            sleep 1
          done
          kill $SERVE_PID 2>/dev/null || true
          [ "$code" = "400" ] && grep -q 'stream_not_supported' /tmp/stream_resp.json && echo 'stream:true -> 400 OK' || (echo 'stream gate FAILED'; exit 1)

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m venv .venv
          .venv/bin/pip install build twine
          .venv/bin/python -m build

      - name: Artifact packaging boundary — built wheel/sdist carry no operator config (DF-CHIMERA-V2-97 gate)
        run: |
          # 0.2.7 shipped the operator fleet config to PyPI. The tag that cut it
          # predates the boundary fix, but this job would not have caught the
          # leak even from a fixed tree: `lint` and `test` grade the SOURCE
          # tree, and only a test over BUILT bytes catches an artifact whose
          # packaging mapping is wrong. `pip install chimera-deliberation`
          # users received an 83,677-byte chimera/chimera.yaml.example that was
          # byte-identical to the checkout-only chimera.yaml.fleet — internal
          # topology plus 42 operator models instead of the public starter.
          #
          # The test builds the wheel AND sdist from THIS checkout through the
          # PEP 517 backend in-process (no build isolation, no network, no
          # writes outside pytest's tmp_path) and asserts on the archive
          # members: chimera.yaml.fleet absent from both, the example present
          # and free of the internal-topology tokens. `.[dev]` is what carries
          # pytest + hatchling (the backend the test imports) plus the suite
          # conftest's runtime imports.
          #
          # It must run BEFORE the PyPI publish step below: a release cannot be
          # withdrawn once uploaded, so the tag run has to fail while dist/ is
          # still unpublished.
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest tests/test_yaml_example_sanitized.py::test_built_artifacts_exclude_fleet_config -q

      - name: Publish to PyPI
        run: .venv/bin/twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  release-verify:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Derive the exact expected version from the triggering tag (DF-CHIMERA-0911-2)
        run: |
          # Strips the leading v, rejects unsafe/non-PEP-440 tags, and fails
          # unless the tag exactly matches pyproject.toml's declared version.
          VERSION=$(python scripts/release_expected_version.py "${GITHUB_REF_NAME}")
          echo "expected published version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Fresh-venv install of the EXACT published version (DF-CHIMERA-0911-2 gate)
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install --upgrade pip
          # Bounded retry for PyPI index propagation lag after twine upload.
          # The requirement is pinned ==${VERSION} on EVERY attempt, so the
          # loop can never silently fall through to a different/latest version.
          installed=0
          for attempt in $(seq 1 20); do
            if /tmp/release-venv/bin/pip install "chimera-deliberation[full]==${VERSION}"; then
              installed=1
              break
            fi
            echo "attempt ${attempt}/20: chimera-deliberation==${VERSION} not yet on PyPI; sleeping 15s"
            sleep 15
          done
          if [ "${installed}" != "1" ]; then
            echo "FATAL: chimera-deliberation[full]==${VERSION} never became installable after 20 attempts (~5 min)"
            exit 1
          fi
          # Belt-and-braces: the imported package must BE the tag version.
          /tmp/release-venv/bin/python -c "import chimera, sys; v = chimera.__version__; print('installed', v); sys.exit(0 if v == '${VERSION}' else 'installed %r != tag version ${VERSION}' % v)"

      - name: README quickstart CLI surface on the PUBLISHED wheel — --version / -m --version / --help / config init (DF-CHIMERA-0916B-3 gate)
        run: |
          # Asserts the CLI surface README's Quickstart block documents against
          # the PUBLISHED, pinned wheel — not against the repo tree. 0.2.5
          # shipped with `chimera --version` exiting 2 ("Error: No such option
          # '--version'.") because the tag was cut two days behind the --version
          # commit (d6f144c): repo HEAD had the flag, the artifact users
          # installed did not, and every earlier gate in this job stayed green.
          # Each check runs in its own empty temp cwd (never the repo root) and
          # exits 1 naming the failing check.
          python scripts/quickstart_battery.py --venv /tmp/release-venv --expected-version "${VERSION}"

      - name: Release-content check on the PUBLISHED wheel — MCP initialize version + missing-config remedy (DF-CHIMERA-V2-9 / DF-CHIMERA-V2-8 gate)
        run: |
          # Two first-run behaviours of the INSTALLED artifact, both fixed after
          # the tag that shipped without them, and neither asserted by any other
          # gate in this job:
          #   DF-CHIMERA-V2-9: the chimera-mcp initialize handshake must
          #     advertise chimera's PACKAGE version. Pre-fix it advertised the
          #     mcp SDK's own version (1.28.1) for a 0.2.6 build, so an MCP
          #     client could not tell which chimera build it had reached.
          #   DF-CHIMERA-V2-8: the installed missing-config error must name
          #     `chimera config init`. Pre-fix it only said to copy
          #     chimera.yaml.example from the cwd — impossible for a bare pip
          #     install, whose template lives inside the wheel.
          # scripts/release_content_check.py EXECUTES the pinned venv: a real
          # initialize request over stdio (version compared with the tag AND
          # with that venv's own mcp distribution), plus the installed config
          # module's error message read in a fresh empty temp cwd. Offline and
          # keyless, so it runs here — after the pinned install and before the
          # expensive live gates — and exits non-zero naming the failing check.
          python scripts/release_content_check.py --venv /tmp/release-venv --expected-version "${VERSION}"

      - name: Quickstart E2E — config init + bare run at the exact tag version (DF-CHIMERA-0906-1 gate)
        run: |
          cd /tmp
          /tmp/release-venv/bin/chimera config init
          test -f chimera.yaml && echo 'config init OK'
          timeout 180 /tmp/release-venv/bin/chimera run "Reply with exactly: GATE-OK" 2>&1 | tee /tmp/gate_run.out
          grep -q "GATE-OK" /tmp/gate_run.out && echo 'bare run merged answer OK'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: MCP stdio purity probe — real tools/call depth, both gate formations (DF-CHIMERA-0911-2 gate)
        run: |
          # scripts/probe_mcp_stdio.py drives initialize -> tools/list -> a REAL
          # chimera_deliberate tools/call and exits 1 on ANY non-JSON-RPC stdout
          # line. The leak this gates is formation-dependent (0.2.3's 'speed'
          # OpenRouter leg printed LiteLLM's banner to stdout while 'simple'
          # stayed clean), and the old initialize-only handshake grep passed
          # 0.2.3 — so both formations are probed at full depth.
          #
          # DF-CHIMERA-0917-5: the probe provisions its OWN config. The repo-root
          # chimera.yaml is untracked by design, so a fresh checkout has none and
          # the probe used to drive an empty config (every call answered
          # unknown_formation in ~1s with zero provider calls). It now generates
          # a config in a temp dir with the release venv's own `chimera config
          # init` and points the child at it via CHIMERA_CONFIG. It also remaps
          # models whose provider has no credential here (the 'speed' formation's
          # OpenRouter worker) onto DEEPSEEK_API_KEY, printing each substitution
          # as FORMATION_MODEL_REMAP=... — so OPENROUTER_API_KEY is NOT required
          # by this step (the repo has no such secret; only DEEPSEEK_API_KEY and
          # PYPI_TOKEN exist, and tests/test_release_workflow.py pins that).
          python scripts/probe_mcp_stdio.py --formation=simple /tmp/release-venv/bin/chimera-mcp
          python scripts/probe_mcp_stdio.py --formation=speed /tmp/release-venv/bin/chimera-mcp
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
