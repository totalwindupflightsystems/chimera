guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  # Worktree-safe test lane: a fresh worktree has no .venv (gitignored), and a
  # venv-less pytest resolves OFF PATH to a foreign interpreter whose
  # `import chimera` fails in tests/conftest.py (ModuleNotFoundError). Seed the
  # venv (dev extra = pytest) when it is missing, then run the VENV's pytest by
  # path — the seed only guarantees `.venv/bin/pytest` exists, so a bare
  # `pytest` still resolved to /usr/bin/pytest and failed at conftest import
  # with `No module named 'structlog'` on every commit that touched Python.
  # NOTE: `.venv/bin/pytest` still narrows in `test_mode: diff` — the guard's
  # target builder matches a `.venv/bin/pytest` invocation — but editing THIS
  # file is itself a force-full trigger, so a commit that touches it runs the
  # whole suite (see _FORCE_FULL_TEST_GLOBS in engine/guard_manager.py).
  test_command: >-
    test -x .venv/bin/pytest || uv sync --extra dev;
    .venv/bin/pytest -x --tb=short
  # The gate must be able to finish the suite it demands. Measured at HEAD
  # 06ef557: the full suite is 155s on an idle box and 180-232s under fleet
  # load, so the 180s default made EVERY Python commit unpassable — on
  # CHIMERA-V2-REVIEW-07 the worker's fix ran green (2232 passed, 3 skipped,
  # 180.25s) and the hook still blocked it twice with "Tests timed out after
  # 180s". 600s is a ceiling, not a target: a hung suite still fails.
  test_timeout: 600
  # INT-CI-021: hook_timeout must exceed test_timeout, or the guard cuts itself
  # off mid-suite and reports a fail-open PASS (it warns and raises the budget
  # for the single run, but the source has to be fixed). 900 > 600.
  hook_timeout: 900
  dead_code: false
  skylos: false
  lsp: true
  lsp_tools:
  - pylsp
  static_analysis: true
  # INT-CI-021: an empty mapping made this lane select no tool, so it reported
  # SKIP on every run — a configured-but-missing tool is a SKIP, never a silent
  # pass (REVIEW-GITREINS-018), and a skip degrades the whole run. Python is
  # selected by packaging marker (pyproject.toml); the engine runs exactly
  # `mypy --no-error-summary --explicit-package-bases .`, resolved from PATH.
  static_analysis_tools:
    python: ["mypy"]
pipeline:
  stages:
  - id: tier1
    parallel: true
    true:
    - pre-commit
    - pre-eval
    steps:
    - id: guard
      type: script
      run: gitreins guard
      on_fail: block
      # Step budget must exceed the guard's own test ceiling (test_timeout: 600,
      # suite measured 155-232s): the judge's tier1 step default is 120s, which
      # timed out on CHIMERA-V2-REVIEW-09 and DEGRADED an otherwise all-PASS
      # tier2 verdict (verdict dir 2026-11-18/11e3938a). 600s, same ceiling.
      timeout: 600
  - id: tier2
    type: ai_eval
    true:
    - pre-eval
    condition: 'true'
    max_iterations: 300
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox
    - detect_dead_code
evaluator:
  max_iterations: 300
  max_time: 90m
  max_input_tokens: 16M
  max_output_tokens: 4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  # INT-CI-021: `provider` and `api_key_env` are not GitReins config keys (the
  # schema ignores them with a WARN that degrades every guard run). The judge
  # lane is resolved from GITREINS_LLM_PROVIDER / GITREINS_LLM_BASE_URL /
  # GITREINS_LLM_API_KEY in the environment — set those, not this block.
  security_scan:
    enabled: true
    cve_source: nvd
    min_confidence: 0.5

history:
  enabled: true
  storage: git
  max_verdicts: 1000
