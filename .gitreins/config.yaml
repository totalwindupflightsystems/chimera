defaults:
  # The updater prints "Update available: vX → URL" as the FIRST line of every
  # gitreins invocation, and the tier1 verdict summary reads the first output
  # line — so on a host that is one release behind, every tier1 is graded FAIL
  # while the guard itself exits 0 (log: `overall: PASS (DEGRADED — skipped
  # checks)`). Disabled here so the gate reports the tree, not the version;
  # upgrade with `pipx upgrade gitreins` and re-enable when the fleet bumps.
  check_for_updates: false

guards:
  secrets: true
  lint: true
  tests: true
  test_mode: diff
  # Worktree-safe test lane: a fresh worktree has no .venv (gitignored), and a
  # venv-less pytest resolves OFF PATH to a foreign interpreter whose
  # `import chimera` fails in tests/conftest.py (ModuleNotFoundError). Seed the
  # venv (dev extra = pytest) when it is missing, then run the VENV's pytest by
  # path — the seed only guarantees `.venv/bin/pytest` exists, so a bare
  # `pytest` still resolved to /usr/bin/pytest and failed at conftest import
  # with `No module named 'structlog'` on every commit that touched Python.
  # NOTE: `.venv/bin/pytest` still narrows in `test_mode: diff` — the guard's
  # target builder matches a `.venv/bin/pytest` invocation — but editing THIS
  # file is itself a force-full trigger, so a commit that touches it runs the
  # whole suite (see _FORCE_FULL_TEST_GLOBS in engine/guard_manager.py).
  test_command: >-
    test -x .venv/bin/pytest || uv sync --extra dev;
    .venv/bin/pytest -x --tb=short
  dead_code: false
  skylos: false
  lsp: true
  lsp_tools:
  - pylsp
  static_analysis: true
  static_analysis_tools: {}
pipeline:
  stages:
  - id: tier1
    parallel: true
    true:
    - pre-commit
    - pre-eval
    steps:
    - id: guard
      type: script
      run: gitreins guard
      on_fail: block
  - id: tier2
    type: ai_eval
    true:
    - pre-eval
    condition: 'true'
    max_iterations: 300
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox
    - detect_dead_code
evaluator:
  max_iterations: 300
  max_time: 90m
  max_input_tokens: 16M
  max_output_tokens: 4M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000

security_scan:
  enabled: true
  cve_source: nvd
  min_confidence: 0.5
