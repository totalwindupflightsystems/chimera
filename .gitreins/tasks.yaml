- id: dogfood-dispatcher-malformed-dag-fallback
  title: 'P1: auto dispatcher emits DAG without aggregator stage -> repair instead
    of silent single-worker fallback'
  criteria:
  - 'C1: parse_dispatch_result repairs an auto DAG that has >=1 worker stage but no
    aggregator/merge/audit stage: appends an ''aggregator'' stage (default_aggregator
    model) whose depends_on == all terminal worker ids, adds (worker, aggregator)
    edges, keeps source==''auto'', preserves worker_prompts and output_schema'
  - 'C2: The repair sets dispatch_note containing ''repaired'' on the DispatchResult
    (e.g. ''repaired: added aggregator stage for N worker terminals'')'
  - "C3: Malformed/unparseable dispatcher output (bad JSON like 'this is not json')\
    \ -> source=='fallback' with fallback_reason=='malformed_json'. A gateway-failure\
    \ empty payload ('{}') also falls back with a visible non-None fallback_reason\
    \ (invalid_dag: dispatch produced no stages \u2014 the empty object parses as\
    \ valid JSON that has no formation stages)"
  - 'C4: A DAG with no worker stages -> source==''fallback'' with fallback_reason
    starting ''invalid_dag'''
  - 'C5: DeliberationTrace (src/chimera/engine.py) has a dispatch_note field wired
    in _assemble_trace from dispatch.fallback_reason or dispatch.dispatch_note so
    API/CLI/MCP consumers see why a fallback/repair happened'
  - 'C6: Valid dispatcher payload -> fallback_reason is None and dispatch_note is
    None'
  - 'C7: Unit tests in tests/test_dispatcher.py cover: 2-worker repair, 1-worker repair,
    malformed->reason, no-workers->invalid_dag reason, output_schema preserved, valid
    payload->both None'
  - 'C8: Full test suite: no NEW failures beyond the pre-existing pricing-drift baseline
    (1 fail, 62 skip)'
  status: complete
  created_at: '2026-08-04T01:24:02.235098+00:00'
  completed_at: '2026-08-04T01:28:09.582938+00:00'
