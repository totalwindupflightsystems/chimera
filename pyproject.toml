#   openai 3.35.1             — litellm 1.99.4 requires openai>=2.20.0,<3.0.0
#   importlib_metadata 9.0.1  — litellm 1.99.4 requires importlib-metadata>=8,<9
#   pyflakes 4.0.3            — python-lsp-server[pyflakes] requires >=3.2,<3.3
#   pycodestyle 2.15.0        — python-lsp-server[pycodestyle] requires
#                               >=2.12,<2.13
#   huggingface_hub 2.2.0     — policy-held major; tokenizers allows <3.0 but
