#   multidict 7.1.0           — policy-held major; aiohttp allows <8.0, yarl
#                               uncapped, but no importer beyond aiohttp/yarl
#
# 2026-10-20 census (SUP-DEPS-20261020-CHV2): the supervisor dep census reported
# 10 outdated packages; 8 are the holds above (unchanged, re-verified below) and
# two were in-bounds and bumped through `uv lock --upgrade-package fastapi
# --upgrade-package pydantic-settings` + `uv sync --all-extras`:
#   fastapi 0.150.0->0.153.0          — resolver-in-bounds; the declared floor
#                       in the server/web/dev/full extras moves with it
#                       (>=0.115.0 -> >=0.153.0) so the metadata minimum matches
#                       the locked reality
#   pydantic-settings 2.16.0->2.16.1  — patch bump; transitive via litellm and
#                       mcp (no direct declaration in this file, so no floor to
#                       move); both allow pydantic-settings>=2.x uncapped
# Holds re-verified unmoved in uv.lock after the bump: litellm 1.99.4,
# mcp 1.30.0, openai 2.54.0, importlib-metadata 8.9.0, pyflakes 3.2.0,
# pycodestyle 2.12.1, huggingface-hub 1.33.0, multidict 6.9.1.
#
# 2026-10-21 census (SUP-DEPS-20261021-CV, supervisor check-deps: 14 outdated
# in the repo venv). Every entry is accounted for below; nothing was left as an
# unexplained null. Four lock distributions were in-bounds and bumped through
# `uv lock --upgrade-package boto3 --upgrade-package botocore
# --upgrade-package fastapi` + `uv sync --all-extras --inexact`:
#   boto3 1.43.115->1.43.116, botocore 1.43.115->1.43.116 — litellm allows
#                       boto3>=1.43.1,<2.0 and boto3 1.43.116 pins
#                       botocore>=1.43.116,<1.44.0, so the pair moves together;
#                       resolver moved freely, no cap in this tree
#   fastapi 0.153.0->0.156.4   — declared in the server/web/dev/full extras with
#                       no upper bound; the declared floor moves with it
#                       (>=0.153.0 -> >=0.156.4) so the metadata minimum keeps
#                       matching the locked reality, and the pin that guards
#                       that contract (tests/test_dev_extra_deps.py
#                       _SERVER_RUNTIME_SPECS) moved in the same commit — a
#                       value and the test that pins it must never diverge
#   pydantic-settings 2.16.0->2.16.1 — already resolved to 2.16.1 in uv.lock by
#                       the 2026-10-20 tick; the REPO VENV had drifted one patch
#                       behind the lock (2.16.0) and this tick's sync reconciled
#                       it. Not a new resolution — a venv/lock reconciliation,
#                       which is why it appears in the census without a lock
#                       diff line.
# Two entries are venv tooling, not uv.lock distributions (uv resolves only what
# this file declares; nothing here depends on either), so they are bumped in the
# venv itself via `python -m pip install -U pip setuptools`:
#   pip 26.2.1->26.2.2, setuptools 84.2.0->84.2.1
# The remaining EIGHT are HELD, each re-verified against installed metadata this
# tick and unmoved in uv.lock afterwards (litellm 1.99.4, mcp 1.30.0,
# openai 2.54.0, importlib-metadata 8.9.0, pyflakes 3.2.0, pycodestyle 2.12.1,
# huggingface-hub 1.33.0, multidict 6.9.1) — same reasons as the blocks above:
# this file's own <1.100 / <2.0 caps, litellm's openai<3.0 and
# importlib-metadata<9 caps, pylsp's pyflakes<3.3 / pycodestyle<2.13 caps, and
# the two policy-held majors (huggingface_hub 2.x, multidict 7.x) with no
# concrete need and no importer beyond aiohttp/yarl. Re-open either only with a
# concrete need.
# Gate record 2026-10-21 — AUTHORITATIVE runs in the repo tree (repo venv,
# CPython 3.11.15, live untracked chimera.yaml present):
#   uv lock --check                 -> "Resolved 109 packages", exit 0
#   .venv/bin/python -m pip check   -> "No broken requirements found.", exit 0
