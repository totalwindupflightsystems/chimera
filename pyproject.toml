[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera-deliberation"
version = "0.2.7"
description = "Dynamic multi-model deliberation gateway"
requires-python = ">=3.11"
authors = [
    { name = "Total Wind-Up Flight Systems", email = "dev@totalwindup.com" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["llm", "ai", "multi-model", "deliberation", "orchestration", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Upper bound is load-bearing: litellm 1.100.0 replaced its plain
    # ``logging.StreamHandler()`` (stderr) with ``LevelRoutingStreamHandler``,
    # which routes every record BELOW WARNING to sys.stdout. That silently
    # pollutes stdout on the first real completion() — fatal for the MCP stdio
    # transport, whose stdout is the JSON-RPC wire (force_stderr only pins
    # chimera's own sinks). 1.99.0 still uses the stderr handler.
    #
    # The cap is NOT sufficient on its own: every release in range keeps the
    # separate, always-on bare-print paths gated by the process-global
    # ``litellm.suppress_debug_info`` (False by default) — the ANSI "Provider
    # List" banner and the "Give Feedback / Get Help" block, both plain
    # ``print()`` to stdout. chimera.gateway.ensure_litellm_quiet() sets that
    # flag before every completion; keep both guards.
    "litellm>=1.50.0,<1.100",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "httpx2>=2.0",
    "structlog>=24.0",
    "jsonschema>=4.0",
    # Console-script deps live in the BASE package (CH-GAP-041): the
    # [project.scripts] entry points ship with a bare install, so click/rich/mcp
    # must be present without extras — otherwise `chimera --help` and the
    # chimera-mcp handshake crash on a bare wheel.
    "click>=8.0",
    "rich>=13.0",
    "mcp>=1.0.0,<2.0",
]

# Deferred majors — DEPS-008 census (2026-10-05); re-derived 2026-10-13
# (SUP-DEPS-20261013-CHV2), again 2026-10-15 (SUP-DEPS-20261015-CHV2) and
# again 2026-10-17 (SUP-DEPS-20261016-CHV2):
# every held entry re-verified against current caps rather than copied.
# 2026-10-15 `pip list --outdated` had 12 entries; 4 were in-bounds and
# upgraded that day (transitive, no cap in this tree forbade them):
#   boto3 1.43.113 -> 1.43.114 + botocore 1.43.113 -> 1.43.114
#                       — transitive via litellm (<1.100 allows the 1.43.x
#                       line); resolver moved freely, probe: pip check clean
#   filelock 4.1.2 -> 4.2.0
#                       — transitive via huggingface-hub 1.x (requires
#                       filelock>=4,<5); resolver moved freely
#   pluggy 1.6.0 -> 1.7.0
#                       — transitive via pytest 9.1 / pylsp; resolver moved
#                       freely, full suite green after the bump
# The remaining 7+ are accounted for here; re-derive before acting on any
# single line (parent caps evolve with their parents):
#   openai 3.x        — resolver-refused: litellm 1.99.x requires
#                       openai>=2.20,<3.0; 3.0 also switches the default HTTP
#                       client to httpx2. NOTE src/chimera/gateway.py imports
#                       openai directly although the dependency is declared
#                       only transitively through litellm — the <3.0 cap is
#                       litellm's, not ours.
#   litellm 1.100+    — deliberate <1.100 cap above (stdout pollution
#                       breaks the MCP stdio JSON-RPC wire); resolver-refused
#   mcp 2.x           — deliberate <2.0 cap; 2.x removes pydantic-settings /
#                       MCP_* env vars and changes handler signatures used by
#                       src/chimera/mcp/server.py (FastMCP); resolver-refused
#   multidict 7.x     — HELD by policy, not constraint: aiohttp 3.14.5 allows
#                       multidict>=4.5,<8.0 and yarl 1.25.1 sets no cap, so
#                       the resolver moves it freely; probe-tested 2026-10-13
#                       green through the real C-extension paths (CIMultiDict,
#                       yarl URL build, aiohttp live GET). 7.x is still a
#                       major with no concrete need and no importer in this
#                       tree beyond aiohttp/yarl
#   importlib_metadata 9 — resolver-refused: litellm 1.99.x requires
#                       importlib-metadata>=8,<9.0
#   huggingface_hub 2.x — HELD by policy, not constraint: tokenizers 0.23.3
#                       allows huggingface-hub>=0.16.4,<3.0, so the resolver
#                       moves it freely; probe-tested 2026-10-13 green
#                       (hf-hub 2.2.0 imports, tokenizers 0.23.3 round-trip,
#                       litellm.token_counter). Nothing in chimera, litellm or
#                       tokenizers imports huggingface_hub at all — litellm
#                       mentions it only in comments — so the bump buys
#                       nothing that could be tested
#   pydantic_core — resolved 2026-10-11 (SUP-DEPS-20261010-CHIMERA):
#                       pydantic 2.14.0 released; bumped together with
#                       pydantic-core 2.50.0 (exact pin moves with pydantic)
#   pyflakes 4.x      — resolver-refused: pylsp 1.15.0 pyflakes extra requires
#                       pyflakes>=3.2,<3.3 (3.2.0 is that ceiling)
#   pycodestyle 2.13+ — resolver-refused: pylsp 1.15.0 pycodestyle extra
#                       requires >=2.12,<2.13
#
# starlette 1.7.0 -> 1.8.0 (refreshed 2026-10-13): not a census entry — it was
# in-bounds drift, capped by nobody (mcp>=0.27, fastapi>=0.46, sse-starlette
# >=0.49.1), and 1.8.0 only drops Python 3.10 plus adds HTTP 103 early hints.
#
# In-bounds patch drift refreshed 2026-10-17 (SUP-DEPS-20261016-CHV2) — also
# not census entries, and both cases are lowered by a parent that sets no upper
# bound on the line, so the resolver moved them freely:
#   fastapi 0.143.2 -> 0.143.3 — declared in the dev/server/web/full extras as
#                       fastapi>=0.115.0 (no upper bound). 0.143.3 is a
#                       one-fix release: non-finite float serialization in
#                       JSONL and SSE streams (upstream PR #16509).
#   platformdirs 4.13.0 -> 4.13.3 — transitive via black 26.10.1 (requires
#                       platformdirs with no cap). Patch-only fixes on the
#                       XDG fonts path, quoted-backslash preservation and a
#                       Windows known-folder buffer free; no API change.
#
# Full census re-derivation 2026-10-17 (SUP-DEPS-20261016-CHV2, on top of the
# 683c7dd in-bounds batch): `pip list --outdated` reports EXACTLY the eight
# entries already accounted for above — huggingface_hub 1.33.0->2.2.0,
# importlib_metadata 8.9.0->9.0.1, litellm 1.99.4->1.105.1, mcp 1.30.0->2.3.0,
# multidict 6.9.1->7.1.0, openai 2.54.0->3.33.0, pycodestyle 2.12.1->2.15.0,
# pyflakes 3.2.0->4.0.3. No in-bounds drift is left to take, so ZERO
# distributions were bumped this tick: all eight are either a major held by
# policy or refused by a parent cap. Two labels from the scan were wrong and are
# corrected here — importlib_metadata 8->9 is a MAJOR bump (not "within 8.x"),
# and pycodestyle 2.15.0 is not reachable at all (pylsp caps <2.13).
#
# Probe method (do not repeat the trap): `uv pip compile pyproject.toml
# --all-extras --upgrade-package <candidate>` ALONE is not a compatibility
# answer for these entries, because it leaves every OTHER package free to move.
# For importlib_metadata==9.0.1 and openai==3.33.0 it printed "Resolved 94
# packages" by silently DOWNGRADING litellm 1.99.4 -> 1.83.0 (releases that cap
# neither). Pin the held neighbour in the same invocation and the cap becomes
# the answer:
#   --upgrade-package litellm==1.99.4 --upgrade-package importlib_metadata==9.0.1
#     -> "Because litellm==1.99.4 depends on importlib-metadata>=8.0.0,<9.0 ..."
#   --upgrade-package litellm==1.99.4 --upgrade-package openai==3.33.0
#     -> "Because litellm==1.99.4 depends on openai>=2.20.0,<3.0.0 ..."
#   --upgrade-package pycodestyle==2.15.0
#     -> python-lsp-server[pycodestyle] requires pycodestyle>=2.12.0,<2.13.0
#   --upgrade-package pyflakes==4.0.3
#     -> python-lsp-server[pyflakes] requires pyflakes>=3.2.0,<3.3.0
#   --upgrade-package litellm==1.105.1 / mcp==2.3.0
#     -> unsatisfiable against this file's own <1.100 / <2.0 caps
# multidict 7.x and huggingface_hub 2.x still resolve freely (policy holds: no
# constraint anywhere in this tree) and stay held — both are majors with no
# concrete need, and the 2026-10-13 probe already took the C-extension paths
# (CIMultiDict, yarl URL build, aiohttp live GET) and the hf-hub/tokenizers/
# litellm.token_counter round-trip green. Re-taking a major to buy nothing is
# not a fix; re-open either only with a concrete need.

[project.urls]
Homepage = "https://github.com/totalwindupflightsystems/chimera"
Repository = "https://github.com/totalwindupflightsystems/chimera.git"
Issues = "https://github.com/totalwindupflightsystems/chimera/issues"
Changelog = "https://github.com/totalwindupflightsystems/chimera/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
cli = ["click>=8.0", "rich>=13.0"]
mcp = ["mcp>=1.0.0,<2.0"]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
dev = [
    # Test collection imports the FastAPI app (tests/test_engine_coverage.py ->
    # chimera.api.server), so the documented `pip install -e ".[dev]"` must carry
    # the same runtime pins as the server/web extras — otherwise collection dies
    # with ModuleNotFoundError: No module named 'fastapi' (QA-CHIMERA-001).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3.0",
    # GitReins' `lsp` guard lane resolves the binary with shutil.which(), i.e.
    # from PATH only, and a lane that cannot find its tool is not a pass — it is
    # a SKIP, which degrades the whole run (and reads FAIL here, because
    # guards.allow_skips stays unset on purpose). The documented guard command
    # puts this venv first on PATH, so declaring the server as a dev dependency
    # is what makes the lane deterministic instead of a silent skip.
    #
    # The extras are load-bearing for the same reason (INT-GATE-003): pylsp
    # advertises its lint plugins (`pycodestyle`, `pyflakes`) as entry points,
    # but the libraries those plugin modules import live behind the extras. A
    # bare install starts a server that publishes no diagnostic for anything
    # and the lane prints `pylsp — clean` on every diff — a vacuous green.
    "python-lsp-server[pycodestyle,pyflakes]>=1.12.0",
    "ruff>=0.16.10",
]
full = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "click>=8.0",
    "rich>=13.0",
    "mcp>=1.0.0,<2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.10",
]

[project.scripts]
chimera = "chimera.cli.main:main"
chimera-mcp = "chimera.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera"]

[tool.hatch.build.targets.wheel.force-include]
"chimera.yaml.docker" = "chimera/chimera.yaml.docker"
"chimera.yaml.example" = "chimera/chimera.yaml.example"

# REV-CHIMERA-V2-20261005-3: chimera.yaml.fleet is the full operator config
# reference and carries internal topology (tailnet hostnames, internal gateway
# ports). It is tracked for the checkout only and must NEVER ship — the wheel
# force-include table above does not mention it, and this exclude keeps it out
# of the sdist too (`python -m build` produces both; twine uploads dist/*).
# tests/test_yaml_example_sanitized.py pins the wheel boundary.
[tool.hatch.build.targets.sdist]
exclude = [
  "chimera.yaml.fleet",
]

[tool.ruff]
target-version = "py311"
line-length = 110
# Scope the file resolver to Python sources on purpose. Ruff 0.16 widened its
# DEFAULT `include` to `*.md` (alongside `*.py`, `*.pyi`, `*.ipynb`,
# `**/pyproject.toml`), so `ruff format` started rewriting the fenced Python
# blocks inside docs/, specs/ and skills/ — documentation prose that is not
# ours to restyle, and whose snippets must stay verbatim prose samples.
# Pinning `include` here keeps both the lint and format lanes over .py files
# only, which is also what docs/GITREINS.md documents for the lint lane
# ("ruff check over the staged Python files"). CH-LINT-DRIFT-001.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# DF-CHIMERA-V2-73/75: tests must exercise THIS checkout's src/chimera, never
# the venv's editable install (its .pth points at whatever tree installed it —
# a worktree running tests against the MAIN clone's code silently passes/fails
# on the wrong source). ``src`` on sys.path[0] (pytest inserts ini pythonpath
# BEFORE site-packages) makes the local tree win deterministically.
pythonpath = ["src"]
markers = [
    "integration: integration tests (require --run-integration flag and live API keys)",
    "slow: tests that are slow to run",
    "compat: compatibility smoke tests (require --run-compat flag)",
]
